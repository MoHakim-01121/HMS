<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Account Credentials</title>
  <style>
    @page { size: 86mm 55mm; margin: 0; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: #f2f3f5;
      color: #111;
    }

    .card {
      position: absolute;
      top: 1mm; left: 1mm; right: 1mm; bottom: 1mm;
      background: #fff;
      border: 0.4mm solid #e9ebee;
      border-radius: 4mm;
      padding: 4.5mm 5mm;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4mm;
    }
    .doc-title { font-size: 11px; font-weight: 700; color: #111; }
    .logo { max-height: 5mm; width: auto; }

    .field { margin-bottom: 3mm; }
    .label {
      font-size: 6.5px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #9aa0a6;
      margin-bottom: 1mm;
    }
    .value {
      font-size: 14px;
      font-weight: 700;
      color: #111;
      word-break: break-all;
      line-height: 1.3;
    }

    .note {
      margin-top: 3.5mm;
      font-size: 8px;
      color: #dc2626;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="doc-title">Account Credentials</div>
      <img src="{{ logo_rel_path }}" class="logo">
    </div>

    <div class="field">
      <div class="label">Username</div>
      <div class="value">{{ username }}</div>
    </div>

    <div class="field">
      <div class="label">Password</div>
      <div class="value">{{ password }}</div>
    </div>

    <div class="note">
      Keep these credentials private. Never share your login.
      Staff never ask for your password.
    </div>
  </div>
</body>
</html>
