{% load static django_vite %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page_title|default:"Workspace" }}</title>
  {% if meta_description %}<meta name="description" content="{{ meta_description }}">{% endif %}
  {% if og_image %}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page_title|default:"Workspace" }}">
  <meta property="og:description" content="{{ meta_description }}">
  <meta property="og:image" content="{{ og_image }}">
  <meta property="og:url" content="{{ request.build_absolute_uri }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page_title|default:"Workspace" }}">
  <meta name="twitter:description" content="{{ meta_description }}">
  <meta name="twitter:image" content="{{ og_image }}">
  {% endif %}
  <script>(function(){var t=localStorage.getItem('theme')||'dark';document.documentElement.setAttribute('data-theme',t);})();</script>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23404040' stroke-width='2'><path stroke-linecap='round' stroke-linejoin='round' d='M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{% static 'hw/css/design.css' %}">
  <link rel="stylesheet" href="{% static 'hw/css/shell.css' %}">
  <link rel="stylesheet" href="{% static 'hw/css/forms.css' %}">
  <link rel="stylesheet" href="{% static 'hw/css/invoice_form.css' %}">
  {% vite_preload_asset 'main.jsx' %}
  {% vite_react_refresh %}
  {% vite_hmr_client %}
  {% vite_asset 'main.jsx' %}
</head>
<body>
  {% block inertia %}{% endblock %}
</body>
</html>
