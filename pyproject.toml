[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["hw/migrations", "cutover", "node_modules", "staticfiles"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",  # pycodestyle errors (no style nits; ruff format owns layout)
    "F",               # pyflakes: unused imports/variables, undefined names
    "I",               # isort
    "DJ",              # flake8-django
    "B",               # flake8-bugbear
    "UP",              # pyupgrade
]
# House idioms: `l` for a ledger/line row, one-line `if x: return`, small lambdas.
ignore = ["E701", "E702", "E731", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["hw", "config"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # package re-exports (views, models)
"hw/tests/**" = ["DJ"]
